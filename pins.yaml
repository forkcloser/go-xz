# The XZ Utils binary the interop tests hold the package to (interop_test.go):
# forkcloser/testbin's build of upstream's release, one archive per platform
# the tests run on, verified against testbin's release attestation (limen's
# book, tooling.md, "Pinned artifacts beyond aqua"). The `xz-utils` recipe
# fetches this host's and puts it on the tests' PATH as xz-utils. The archive
# is named for its platform alone, so a testbin release moves `version:` and
# nothing else, whatever XZ Utils it builds: which one that is, the recipe
# prints. The attestation is held to testbin's release workflow by name: a
# workflow renamed there fails the next refresh, closed.
pins:
  - name: xz-utils-linux-amd64
    renovate: github-releases forkcloser/testbin
    version: 0.5.0
    url: https://github.com/forkcloser/testbin/releases/download/v${version}/xz-linux-amd64.tar.gz
    verify: github-attestation forkcloser/testbin forkcloser/testbin/.github/workflows/release.yaml
    digest:
      version: 0.5.0
      source: 9dab5b603caff0fff6fda21076293eaf12a71e2d0cc60b1b20d7924924ec69e9
      sha256: f6cf478de4e79ef4c646fc688d4f28bcb51d3d13cce3b738e481c3e17c4a6205
